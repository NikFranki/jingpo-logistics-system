services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jingpo_logistics
      POSTGRES_USER: jingpo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jingpo-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jingpo -d jingpo_logistics"]
      interval: 5s
      timeout: 5s
      retries: 20

  be:
    build: ./be
    environment:
      DATABASE_URL: postgresql+psycopg://jingpo:${POSTGRES_PASSWORD:-jingpo-local-only}@db:5432/jingpo_logistics
      CORS_ORIGINS: http://localhost:8080
      LOG_LEVEL: INFO
      SCHEDULE_SIGNING_KEY: ${SCHEDULE_SIGNING_KEY:-local-demo-schedule-key-change-me}
      AUTH_FRONTEND_URL: http://localhost:8080
      AUTH_COOKIE_SECURE: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@jingpo.local
      SMTP_STARTTLS: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/auth/google/callback}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  agent:
    build: ./agent
    env_file:
      - ./agent/.env
    environment:
      BE_BASE_URL: http://be:8000
    depends_on:
      be:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8001/agent/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  fe:
    build:
      context: ./fe
      args:
        VITE_AGENT_V8_ENABLED: "true"
    ports:
      - "8080:80"
    depends_on:
      be:
        condition: service_healthy
      agent:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
