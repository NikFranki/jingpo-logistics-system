name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: Hook policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: make check-hooks

  be:
    name: BE checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: checks-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:checks-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: be/requirements*.txt
      - run: python -m pip install -r be/requirements-dev.txt
      - run: make check-be BE_PYTHON=python

  fe:
    name: FE checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - run: npm ci --prefix fe
      - run: make check-fe

  agent:
    name: Agent checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: python -m pip install -r agent/requirements.txt
      - run: make check-agent AGENT_PYTHON=python

  required:
    name: Required checks
    if: ${{ always() }}
    needs: [hooks, be, fe, agent]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          CHECK_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          read -r -a check_results <<< "$CHECK_RESULTS"
          for result in "${check_results[@]}"; do
            if [ "$result" != "success" ]; then
              echo "A required workflow job did not succeed: $result"
              exit 1
            fi
          done
