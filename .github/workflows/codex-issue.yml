name: Codex issue fix

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: codex-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.event.label.name == 'codex-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Create unprivileged Codex user
        run: |
          sudo adduser --system --home /home/guest --shell /bin/bash --group guest
          sudo usermod -a -G guest runner
          sudo usermod -a -G runner guest
          sudo mkdir -p /home/guest/.codex
          # Codex itself must own CODEX_HOME so it can create its app-server
          # state and PATH aliases. Keep the runner group writable because the
          # action and the model setup step also update files there.
          sudo chown -R guest:runner /home/guest/.codex
          sudo chmod 2775 /home/guest/.codex

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Share checkout with Codex user
        run: |
          sudo chown -R runner:guest "$GITHUB_WORKSPACE"
          sudo chmod -R g+rwX "$GITHUB_WORKSPACE"
          sudo find "$GITHUB_WORKSPACE" -type d -exec chmod g+s {} +

      - name: Prepare issue context
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          title = os.environ.get("ISSUE_TITLE", "")
          body = os.environ.get("ISSUE_BODY", "")
          # HTML comments are invisible in GitHub's rendered issue view and may
          # carry prompt injection instructions.
          body = re.sub(r"<!--.*?-->", "", body, flags=re.DOTALL)
          Path("/tmp/codex-issue.md").write_text(
              f"Issue #{os.environ['ISSUE_NUMBER']}: {title}\n\n{body[:20000]}\n",
              encoding="utf-8",
          )
          PY

      - name: Prepare DeepSeek model configuration
        env:
          CODEX_HOME_DIR: /home/guest/.codex
        run: |
          mkdir -p "$CODEX_HOME_DIR"
          cp .github/codex/deepseek-models.json "$CODEX_HOME_DIR/models.json"
          printf '%s\n' \
            'model = "deepseek-flash"' \
            'model_reasoning_effort = "high"' \
            'web_search = "disabled"' \
            "model_catalog_json = \"$CODEX_HOME_DIR/models.json\"" \
            > "$CODEX_HOME_DIR/config.toml"

      - name: Preserve trusted usage collector
        run: |
          sudo install -o root -g root -m 0444 .github/codex/issue_workflow_metadata.py /tmp/codex-usage-collector.py
          sudo install -o root -g root -m 0600 /dev/null /tmp/codex-usage.json

      - name: Run Codex
        id: codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          responses-api-endpoint: https://api.deepseek.com/responses
          prompt-file: .github/codex/issue-fix-prompt.md
          output-file: /tmp/codex-final-message.md
          codex-home: /home/guest/.codex
          codex-version: '0.164.0'
          model: deepseek-flash
          permission-profile: ":workspace"
          safety-strategy: unprivileged-user
          codex-user: guest

      - name: Collect Codex token usage
        if: always()
        run: |
          sudo python3 /tmp/codex-usage-collector.py collect \
            --codex-home /home/guest/.codex \
            --output /tmp/codex-usage.json
          sudo chmod 644 /tmp/codex-usage.json

      - name: Add usage to run summary
        if: always()
        env:
          USAGE_FILE: /tmp/codex-usage.json
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          usage_file = Path(os.environ["USAGE_FILE"])
          data = json.loads(usage_file.read_text()) if usage_file.exists() else {"available": False}
          lines = ["## Codex model usage", ""]
          if data.get("available"):
              usage = data["usage"]
              labels = {
                  "input_tokens": "Input tokens",
                  "cached_input_tokens": "Cached input tokens",
                  "output_tokens": "Output tokens",
                  "reasoning_output_tokens": "Reasoning tokens (included in output)",
                  "total_tokens": "Total tokens",
              }
              lines.extend(f"- {labels[key]}: {value:,}" for key, value in usage.items() if key in labels)
              lines.append("- Billed cost: check DeepSeek account usage; no price estimate is calculated here.")
          else:
              lines.append("- Token usage unavailable in the Codex session record for this run.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Restore checkout ownership
        if: always()
        run: sudo chown -R runner:runner "$GITHUB_WORKSPACE"

      - name: Export patch
        run: |
          git add -N --all
          git diff --binary HEAD -- . > /tmp/codex.patch
          test -s /tmp/codex.patch || {
            echo "Codex did not produce any tracked changes."
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: codex-issue-${{ github.event.issue.number }}
          path: |
            /tmp/codex.patch
            /tmp/codex-final-message.md
            /tmp/codex-usage.json
          if-no-files-found: error
          retention-days: 1

  validate:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: checks-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:checks-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: codex-issue-${{ github.event.issue.number }}
          path: /tmp/codex-issue

      - name: Apply proposed patch
        run: git apply --check /tmp/codex-issue/codex.patch && git apply /tmp/codex-issue/codex.patch

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            be/requirements*.txt
            agent/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - name: Install BE and Agent dependencies
        run: |
          python -m venv /tmp/be-venv
          python -m venv /tmp/agent-venv
          /tmp/be-venv/bin/python -m pip install -r be/requirements-dev.txt
          /tmp/agent-venv/bin/python -m pip install -r agent/requirements.txt
      - run: npm ci --prefix fe
      - run: make check BE_PYTHON=/tmp/be-venv/bin/python AGENT_PYTHON=/tmp/agent-venv/bin/python

  publish:
    needs: [generate, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v4
        with:
          name: codex-issue-${{ github.event.issue.number }}
          path: /tmp/codex-issue

      - name: Preserve trusted PR description helper
        run: cp .github/codex/issue_workflow_metadata.py "$RUNNER_TEMP/issue_workflow_metadata.py"

      - name: Apply validated patch
        run: git apply --check /tmp/codex-issue/codex.patch && git apply /tmp/codex-issue/codex.patch

      - name: Prepare pull request description
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python3 "$RUNNER_TEMP/issue_workflow_metadata.py" build \
            --summary /tmp/codex-issue/codex-final-message.md \
            --usage /tmp/codex-issue/codex-usage.json \
            --output /tmp/codex-issue/pr-body.md \
            --repository "$REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --run-id "$RUN_ID" \
            --server-url "$SERVER_URL"

      - name: Create draft pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: codex/issue-${{ github.event.issue.number }}
          delete-branch: true
          draft: true
          title: "fix: address issue #${{ github.event.issue.number }}"
          body-path: /tmp/codex-issue/pr-body.md
