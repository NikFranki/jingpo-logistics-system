<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>用户确认后执行 · JINGPO Agent V11</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --font-sans:'Geist', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; --font-serif:'Instrument Serif','Noto Serif',serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { background:var(--paper); color:var(--ink); min-height:100vh; display:flex; justify-content:center; padding:40px 24px; font-family:var(--font-sans); }
    .frame { width:100%; max-width:1200px; min-width:0; }
    .eyebrow { font-family:var(--font-mono); font-size:8px; font-weight:500; letter-spacing:.16em; color:var(--muted); margin-bottom:8px; }
    h1 { font-family:var(--font-serif); font-size:32px; font-weight:400; line-height:1.15; margin-bottom:20px; }
    .diagram-container { width:100%; max-width:100%; min-width:0; overflow-x:auto; }
    svg { display:block; width:100%; min-width:1440px; }
    @media print { .diagram-container { overflow-x:visible; } svg { min-width:0; } }
  </style>
</head>
<body>
